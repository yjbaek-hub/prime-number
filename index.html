<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>소수 판별기</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>소수 판별기</h1>
    <p class="subtitle">정수를 입력하면 소수인지 판별해드려요</p>
    <p class="python-badge">🐍 Python (Pyodide)로 실행됩니다</p>

    <form id="prime-form" novalidate>
      <input
        type="text"
        id="number-input"
        placeholder="예: 17"
        inputmode="numeric"
        autocomplete="off"
      >
      <button type="submit" disabled>로딩 중...</button>
    </form>

    <div id="result" class="result" role="status" aria-live="polite"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/pyodide/v0.27.8/full/pyodide.js"></script>
  <script src="script.js"></script>
</body>
</html>
